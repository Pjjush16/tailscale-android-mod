name: Build Tailscale Android with Proxy Mode

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        mkdir -p /opt/android-sdk
        cd /opt/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/
        yes | cmdline-tools/latest/bin/sdkmanager --licenses
        cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        
    - name: Install NDK
      run: |
        cd /opt/android-sdk
        cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
        
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        
    - name: Clone Tailscale Android
      run: |
        git clone --depth 1 https://github.com/tailscale/tailscale-android.git
        
    - name: Apply patch
      run: |
        cd tailscale-android
        patch -p1 < ../patch/proxy-mode.patch
        
    - name: Build libtailscale AAR
      run: |
        cd tailscale-android
        export ANDROID_HOME=/opt/android-sdk
        export ANDROID_NDK_HOME=/opt/android-sdk/ndk/25.2.9519653
        export PATH=$PATH:$ANDROID_HOME/platform-tools:$HOME/go/bin
        
        # Initialize gomobile
        gomobile init
        
        # Build AAR using gomobile bind
        if [ -f "./tool/go" ]; then
          echo "Using tool/go for gomobile bind"
          ./tool/go run golang.org/x/mobile/cmd/gomobile bind -androidapi=21 -target=android/arm,android/arm64 -o libtailscale.aar ./libtailscale
        else
          echo "Using system gomobile bind"
          gomobile bind -androidapi=21 -target=android/arm,android/arm64 -o libtailscale.aar ./libtailscale
        fi
        
    - name: Create tailscale.version file
      run: |
        cd tailscale-android
        # Generate version file using mkversion tool
        ./tool/go run tailscale.com/cmd/mkversion > tailscale.version
        cat tailscale.version
        
    - name: Build APK
      run: |
        cd tailscale-android/android
        export ANDROID_HOME=/opt/android-sdk
        export ANDROID_SDK_ROOT=/opt/android-sdk
        export ANDROID_NDK_HOME=/opt/android-sdk/ndk/25.2.9519653
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tailscale-android-proxy-mode
        path: tailscale-android/android/app/build/outputs/apk/debug/*.apk
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: tailscale-android/android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
