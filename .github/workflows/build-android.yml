name: Build Tailscale Android with Proxy Mode

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        mkdir -p /opt/android-sdk
        cd /opt/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/
        yes | cmdline-tools/latest/bin/sdkmanager --licenses
        cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        
    - name: Install NDK
      run: |
        cd /opt/android-sdk
        cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
        
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        go install golang.org/x/mobile/cmd/gobind@latest
        echo "$HOME/go/bin" >> $GITHUB_PATH
        
    - name: Clone Tailscale Android
      run: |
        git clone --depth 1 https://github.com/tailscale/tailscale-android.git
        
    - name: Apply modifications
      run: |
        cd tailscale-android
        
        # Copy modified files from our repo
        cp ../android/src/main/java/com/tailscale/ipn/BuiltInBrowserActivity.kt android/src/main/java/com/tailscale/ipn/
        cp ../android/src/main/java/com/tailscale/ipn/App.kt android/src/main/java/com/tailscale/ipn/
        cp ../android/src/main/java/com/tailscale/ipn/IPNService.kt android/src/main/java/com/tailscale/ipn/
        cp ../android/src/main/java/com/tailscale/ipn/ui/view/SettingsView.kt android/src/main/java/com/tailscale/ipn/ui/view/
        cp ../android/src/main/java/com/tailscale/ipn/ui/viewModel/SettingsViewModel.kt android/src/main/java/com/tailscale/ipn/ui/viewModel/
        cp ../android/src/main/AndroidManifest.xml android/src/main/
        cp ../libtailscale/proxy.go libtailscale/
        cp ../libtailscale/proxyserver.go libtailscale/
        
        echo "Modified files copied successfully"
        
    - name: Initialize gomobile
      run: |
        export PATH=$PATH:$HOME/go/bin
        export ANDROID_HOME=/opt/android-sdk
        export ANDROID_NDK_HOME=/opt/android-sdk/ndk/25.2.9519653
        cd tailscale-android
        gomobile init
        
    - name: Build libtailscale AAR
      run: |
        cd tailscale-android
        export ANDROID_HOME=/opt/android-sdk
        export ANDROID_NDK_HOME=/opt/android-sdk/ndk/25.2.9519653
        export PATH=$PATH:$HOME/go/bin
        gomobile bind -target=android/arm,android/arm64 -androidapi=21 -o libtailscale.aar ./libtailscale
        
    - name: Create tailscale.version file
      run: |
        cd tailscale-android
        export PATH=$PATH:$HOME/go/bin
        ./tool/go run tailscale.com/cmd/mkversion > tailscale.version
        cat tailscale.version
        
    - name: Copy AAR to libs directory
      run: |
        cd tailscale-android
        mkdir -p android/libs
        cp libtailscale.aar android/libs/
        echo "AAR copied to android/libs/"
        ls -lh android/libs/
        
    - name: Build APK
      run: |
        cd tailscale-android/android
        export ANDROID_HOME=/opt/android-sdk
        export ANDROID_SDK_ROOT=/opt/android-sdk
        export ANDROID_NDK_HOME=/opt/android-sdk/ndk/25.2.9519653
        export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
        
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: tailscale-android-proxy-mode
        path: tailscale-android/android/app/build/outputs/apk/debug/*.apk
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: tailscale-android/android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
